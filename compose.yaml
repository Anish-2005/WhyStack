name: whystack

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    ports:
      - "${WHYSTACK_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-0}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      JSON_BODY_LIMIT: "${JSON_BODY_LIMIT:-2mb}"
      EXPLAIN_RATE_LIMIT: "${EXPLAIN_RATE_LIMIT:-60}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
